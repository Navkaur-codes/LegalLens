services:
  - type: web
    name: legallens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers so the per-IP rate limit sees the real client IP behind Render's proxy.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_MODE
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
